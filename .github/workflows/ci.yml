# Every push and pull request: the checks that need no broker, browser, or proxy.
# Actions are pinned by commit SHA, with the release tag in a comment.
# The Kafka, browser, and deployment suites run in extended.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pnpm/action-setup uses the version in package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check publication controls (no registry writes)
        run: node --test scripts/release/publishing/release.test.mjs
      - run: pnpm build
      - run: pnpm check:contracts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:load
      # Packs every public package and installs the tarballs with npm outside the workspace.
      - run: pnpm test:install
