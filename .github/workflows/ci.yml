# Every push and pull request: the checks that need no broker, browser, or proxy.
# The Kafka, browser, and deployment suites run in extended.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # uses the version in package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:contracts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:load
      # Packs every public package and installs the tarballs with npm outside the workspace.
      - run: pnpm test:install
