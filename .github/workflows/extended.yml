# Nightly and on demand, on Node 24 and 26: real Kafka (Apache Kafka 4.1.2), the install test including
# the installed `streamotter start` over TLS Kafka, browser tests (headless Chromium), and the production
# deployment check behind Caddy; plus, on Node 24, the replicated-broker tier (three brokers, three
# controllers). Every download is pinned and checksum-verified by the setup scripts, including the JDK.
# These tiers fail rather than skip when their broker or Caddy is missing. Actions are pinned by commit
# SHA, with the release tag in a comment.
name: Extended checks

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    name: Kafka, install, browser, and deployment (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start Kafka 4.1.2
        run: pnpm kafka:setup && pnpm kafka:start
      - name: Install headless Chromium and its system libraries
        run: |
          pnpm browsers:setup
          sudo "$(command -v node)" tests/node_modules/playwright/cli.js install-deps chromium
      - run: pnpm deploy:setup
      - run: pnpm test:kafka
      - run: pnpm test:install
      - run: pnpm test:browser
      - run: pnpm test:deploy
      - name: Stop Kafka
        if: always()
        run: pnpm kafka:stop
      - name: Upload the broker log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kafka-log-node-${{ matrix.node }}
          path: .local/kafka.log
          if-no-files-found: ignore

  replicated:
    name: Replicated Kafka (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the replicated Kafka 4.1.2 cluster
        run: pnpm kafka:setup && ./scripts/kafka/replicated-start.sh
      - run: pnpm test:kafka:replicated
      - name: Stop the replicated cluster
        if: always()
        run: ./scripts/kafka/replicated-stop.sh
      - name: Upload the cluster logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kafka-replicated-logs
          path: |
            .local/kafka-replicated/node-*/server.out
            .local/kafka-replicated/node-*/logs/server.log
          if-no-files-found: ignore
