<!doctype html>
<html><head><meta charset="utf-8">
<meta name="output" content="../../social/kafkasocks-banner-draft.png">
<meta name="size" content="1280x220">
<meta name="transparent" content="true">
<!-- DRAFT for the KafkaSocks co-authors' approval: a README banner pointing readers to StreamOtter.
     Rounded card on a transparent ground so it sits on GitHub's light and dark themes. -->
<link rel="stylesheet" href="../brand.css">
<link rel="stylesheet" href="launch-motifs.css">
<script src="social-motifs.js"></script>
<style>
  html, body { background: transparent; }
  .card { position: absolute; inset: 4px; border-radius: 22px; overflow: hidden; background: var(--creek); color: var(--light-ink); }
  .line { left: 52px; top: 50px; display: flex; align-items: center; gap: 34px; }
  .line .t { font: 700 34px/1 var(--display); letter-spacing: -0.01em; }
  .line img { width: 300px; display: block; }
  .line .arrow { font: 700 36px/1 var(--display); color: var(--splash); }
  .sub { left: 52px; top: 128px; font: 500 19px/1.3 var(--mono); color: var(--whisker); }
  .sub b { color: var(--light-ink); font-weight: 500; }
</style></head>
<body><div class="card">
  <svg class="art" id="art"></svg>
  <div class="layer line"><span class="t">The KafkaSocks idea continues in</span><img src="../../streamotter-lockup-horizontal-dark.svg" alt="StreamOtter"><span class="arrow">→</span></div>
  <div class="layer sub">Kafka to the browser, with snapshots, ordered updates and honest <b>live</b>/<b>stale</b> views · <b>streamotter.dev</b></div>
</div>
<script>
  const W = 1272, H = 212;
  const el = document.getElementById("art");
  const crest = SO.wave({ y: 186, amp: 8, len: 520, phase: 1.2, amp2: 3, len2: 190, tilt: -0.03 });
  let o = SO.texture(W, H, { rows: 3, y0: 10, y1: 150, opacity: 0.04, width: 5 });
  o += SO.water(SO.shift(crest, -10), 0, W, H, "#0B2453");
  o += SO.water(SO.shift(crest, 6), 0, W, H, "#0E2A5C");
  o += SO.ribbon(crest, 620, 1290, 10, "url(#azsp)", { peak: 0.6, hang: 0.7 });
  o += SO.ribbon(SO.shift(crest, 12), 840, 1300, 7, "#E9F2FC", { peak: 0.55, hang: 0.5 });
  o += SO.dot(1180, 120, 5, "#04BDFD") + SO.dot(1214, 142, 3, "#048DFC");
  SO.paint(el, o);
</script>
</body></html>
