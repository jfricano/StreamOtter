<!doctype html>
<html><head><meta charset="utf-8">
<meta name="output" content="../../social/recording-end.png">
<meta name="size" content="1920x1080">
<link rel="stylesheet" href="../brand.css">
<link rel="stylesheet" href="launch-motifs.css">
<script src="social-motifs.js"></script>
<style>
  .center { left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .lockup { width: 420px; }
  .head { margin-top: 56px; font-size: 76px; }
  .links { margin-top: 64px; display: grid; grid-template-columns: auto auto; column-gap: 40px; row-gap: 22px; text-align: left; align-items: baseline; }
  .links .k { font: 600 22px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--splash); text-align: right; }
  .links .v { font: 500 40px/1 var(--mono); color: var(--light-ink); }
  .links .v b { color: var(--splash); font-weight: 600; }
</style></head>
<body><div class="stage dark">
  <svg class="art" id="art"></svg>
  <div class="layer center">
    <img class="lockup logo" src="../../streamotter-lockup-stacked-dark.svg" alt="StreamOtter">
    <div class="head">Live state from Kafka to the browser.<br><em>Never&nbsp;silently&nbsp;wrong.</em></div>
    <div class="links">
      <div class="k">Site</div><div class="v">streamotter.dev</div>
      <div class="k">Code</div><div class="v">github.com/jfricano/StreamOtter</div>
      <div class="k">Install</div><div class="v"><b>$</b> npm install streamotter</div>
    </div>
  </div>
</div>
<script>
  const W = 1920, H = 1080;
  const c = SO.creek(W, H, { top: 990, rise: 0, seed: 27, scale: 1.2, streams: 1, phase: 0.5, drops: false });
  SO.paint(document.getElementById("art"), SO.texture(W, H, { rows: 9, y0: 30, y1: 900, opacity: 0.035, width: 7 }) + c.svg);
</script>
</body></html>
